# Mocha panel
watch_config: true
watch_stylesheet: true

bars:
  mocha_panel:
    enabled: true
    class_name: "mocha-panel"
    screens: ["primary"]
    alignment:
      position: "top"
    dimensions:
      width: "100%"
      height: 40
    window_flags:
      auto_hide: false
      always_on_top: false
      windows_app_bar: true
      hide_on_maximized: false
    widgets:
      left: ["cpu", "memory"]
      center: ["clock", "pomodoro", "todo", "notes"]
      right: ["wifi", "bluetooth", "audio", "battery", "power"]

widgets:
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf2db</span>{info[percent][total]}%"
      label_alt: "<span>\uf2db</span> CPU {info[percent][total]}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span>{virtual_mem_percent}%"
      label_alt: "<span>\uefc5</span> RAM {virtual_mem_percent}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"

  pomodoro:
    type: "yasb.pomodoro.PomodoroWidget"
    options:
      label: "<span>{icon}</span>{remaining}"
      label_alt: "<span>{icon}</span> {remaining} | {elapsed}"
      work_duration: 30
      break_duration: 5
      long_break_duration: 15
      long_break_interval: 3
      auto_start_breaks: true
      auto_start_work: true
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
        on_middle: "reset_timer"
      menu:
        alignment: "left"
        border_color: "#45475a"

  todo:
    type: "yasb.todo.TodoWidget"
    options:
      label: "<span>\uf0ae</span>Tasks"
      label_alt: "<span>\uf0ae</span>Tasks {count}/{completed}"
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      menu:
        alignment: "left"
        border_color: "#45475a"
      categories:
        default:
          label: "Important"
        school:
          label: "School"
        projects:
          label: "Projects"
      icons:
        add: "\uf501 New Task"
        checked: "\uf4a7"
        unchecked: "\ue640"

  notes:
    type: "yasb.notes.NotesWidget"
    options:
      label: "<span>\udb85\udce7</span>Notes"
      paste_plain_text: true
      enter_to_add_note: true
      icons:
        copy: "\uf0c5"
      callbacks:
        on_left: "toggle_menu"
        on_right: ""
      menu:
        alignment: "left"
        border_color: "#45475a"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      # Show both Wi-Fi and disconnected glyphs when there is no signal.
      wifi_icons: ["\ue871", "\ue872", "\ue873", "\ue874", "\ue701"]
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span> {ip_addr}"
      ethernet_icon: "\ue839"
      menu_config:
        blur: true
        round_corners: true
        border_color: "#45475a"
        direction: "down"
        offset_top: 6

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb1"
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      menu_config:
        blur: true
        round_corners: true
        border_color: "#45475a"
        alignment: "right"
        direction: "down"
        offset_top: 6
      tooltip: false

  audio:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>{level}"
      mute_text: ""
      icons: ["\ueee8", "\uf026", "\uf027", "\uefcf", "\uf028"]
      callbacks:
        on_right: "toggle_mute"
      tooltip: false

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span class='label'>{icon} {percent}%</span>"
      label_alt: "<span class='label'>{icon} {percent}% | {time_remaining}</span>"
      charging_options:
        icon_format: "{charging_icon}"
      status_icons:
        icon_charging: "\udb80\udc84"
        icon_critical: "\udb80\udc8e"
        icon_low: "\udb80\udc7c"
        icon_medium: "\udb80\udc7e"
        icon_high: "\udb80\udc80"
        icon_full: "\udb80\udc79"
      status_thresholds:
        critical: 10
        low: 30
        medium: 60
        high: 85
        full: 95
      callbacks:
        on_left: "toggle_label"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\ueab0</span>{%d/%m/%Y }<span>\uf017</span>{%H:%M}"
      label_alt: "<span>\uf017</span>{%H:%M}"
      callbacks:
        on_left: "exec notification_center"
        on_right: "toggle_label"
      tooltip: false

  power:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\uf011</span>"
      button_row: 1
      buttons:
        lock: ["\uf023", "Lock"]
        sleep: ["\uf186", "Sleep"]
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Power Off"]
        cancel: ["\udb81\udf3a", "Cancel"]
