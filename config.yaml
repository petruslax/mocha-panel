# Mocha panel
watch_config: true
watch_stylesheet: true

bars:
  mocha_panel:
    enabled: true 
    class_name: "mocha-panel"
    screens: ["primary"]
    alignment:
      position: "top"
    dimensions:
      width: "100%"
      height: 40
    window_flags:
      auto_hide: false
      always_on_top: false
      windows_app_bar: true
      hide_on_maximized: false
    widgets:
      left: [cpu , memory]
      center: ["clock"]
      right: ["wifi","audio" ,"battery", "power"]

widgets:
  audio:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>{level}"
      mute_text: ""
      icons: ["\ueee8", "\uf026", "\uf027", "\uefcf", "\uf028"]
      callbacks:
        on_right: "toggle_mute"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "<span>{icon}</span>{percent}% / {time_remaining}"
      status_thresholds:
        critical: 10
        low: 25
        medium: 50
        high: 75
        full: 100
      status_icons:
        icon_charging: "\uf0e7" # nf-fa-bolt
        icon_critical: "\uf244" # nf-fa-battery-empty
        icon_low: "\uf243" # nf-fa-battery-quarter
        icon_medium: "\uf242" # nf-fa-battery-half
        icon_high: "\uf241" # nf-fa-battery-three-quarters
        icon_full: "\uf240" # nf-fa-battery-full
      callbacks:
        on_left: "toggle_label"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>{icon}</span> {%H:%M}"
      label_alt: "<span>{icon}</span> {%d.%m.%Y}"
      callbacks:
        on_left: "toggle_label"

  power:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\uf011</span>"
      button_row: 1
      buttons:
        lock: ["\uf023", "Lock"]
        sleep: ["\u23fe", "Sleep"]
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Power Off"]
        cancel: ["\udb81\udf3a", "Cancel"]

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      callbacks:
        on_left: "toggle_label"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span>{info[percent][total]}%"
      label_alt: "<span>\uf4bc</span> CPU {info[percent][total]}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span>{virtual_mem_percent}%"
      label_alt: "<span>\uefc5</span> RAM {virtual_mem_percent}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
