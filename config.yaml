# Mocha panel
watch_config: true
watch_stylesheet: true

bars:
  mocha_panel:
    enabled: true
    class_name: "mocha-panel"
    screens: ["primary"]
    alignment:
      position: "top"
    dimensions:
      width: "100%"
      height: 40
    window_flags:
      auto_hide: false
      always_on_top: false
      windows_app_bar: true
      hide_on_maximized: false
    widgets:
      left: ["cpu", "memory"]
      center: []
      right: ["wifi", "bluetooth", "audio", "battery", "clock", "power"]

widgets:
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\ue950</span>{info[percent][total]}%"
      label_alt: "<span>\ue950</span> CPU {info[percent][total]}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\ueea0</span>{virtual_mem_percent}%"
      label_alt: "<span>\ueea0</span> RAM {virtual_mem_percent}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      wifi_icons: ["\ue871", "\ue872", "\ue873", "\ue874", "\ue701"]
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span> {ip_addr}"
      ethernet_icon: "\ue839"
      menu_config:
        blur: true
        round_corners: true
        border_color: "#45475a"
        direction: "down"
        offset_top: 6

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb1"
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      menu_config:
        blur: true
        round_corners: true
        border_color: "#45475a"
        alignment: "right"
        direction: "down"
        offset_top: 6
      tooltip: false

  audio:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>{level}"
      mute_text: ""
      icons: ["\ue74f", "\ue992", "\ue993", "\ue994", "\ue995"]
      callbacks:
        on_right: "toggle_mute"
      tooltip: false

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "<span>{icon}</span>{percent}% | {time_remaining}"
      charging_options:
        icon_format: "{charging_icon}"
      status_icons:
        icon_charging: "\ue83e"
        icon_critical: "\ue850"
        icon_low: "\ue852"
        icon_medium: "\ue855"
        icon_high: "\ue858"
        icon_full: "\ue83f"
      callbacks:
        on_left: "toggle_label"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\ue823</span>{%H:%M}"
      label_alt: "<span>\ue787</span>{%d/%m/%Y }<span>\ue823</span>{%H:%M}"
      callbacks:
        on_left: "exec notification_center"
        on_right: "toggle_label"
      tooltip: false

  power:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\uf011</span>"
      button_row: 1
      buttons:
        lock: ["\uf023", "Lock"]
        sleep: ["\uf186", "Sleep"]
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Power Off"]
        cancel: ["\udb81\udf3a", "Cancel"]
